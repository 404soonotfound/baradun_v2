# Dependabot 버전 갱신 (#303 보안 감사 후속)
# 워크플로의 외부 Action은 커밋 SHA로 고정함(infra/test/workflows.test.ts). 고정한 SHA가 낡지 않게
# Action만 버전 갱신 PR을 받음. SHA와 줄 끝 버전 주석(# v4.4.0)을 함께 바꿔 줌
# - npm 의존성은 버전 갱신을 켜지 않음. 보안 갱신(저장소 설정)만 지금처럼 받음
# - 새 버전은 나온 지 7일 지난 것만(공급망 사고가 드러날 시간을 둠). 보안 갱신에는 적용되지 않음
# - PR CI(ci-ok)는 ci.yml의 Action만 실제로 돌림. deploy.yml·map-tiles.yml 등은 PR에서 글자 검사(가드레일)만 하므로
#   그 파일이 바뀐 갱신 PR은 하나씩 머지함. deploy.yml은 머지 뒤 자동으로 도므로 머지 직후, map-tiles.yml은 수동 실행만이라
#   다음에 지도를 만들 때 그 실행 결과를 확인함(실패하면 되돌림 PR, AGENTS.md)
version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/"는 .github/workflows와 저장소 루트 action.yml을 봄
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    cooldown:
      default-days: 7
    # 패치·마이너만 한 PR로 묶음. 메이저는 Action마다 따로 PR(하나가 CI를 깨도 나머지 갱신이 막히지 않게)
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # 메이저 PR이 오래 열려 있어도 묶음 PR이 막히지 않게 여유를 둠(Action 9종)
    open-pull-requests-limit: 5
    # 커밋·PR 제목을 저장소 규칙(chore(deps))에 맞춤. 기본값은 'Build(deps): Bump …'
    commit-message:
      prefix: "chore(deps)"
    # 기본 생태계 라벨(github_actions)을 새로 만들지 않게 기존 dependencies 라벨만 씀(AGENTS.md 라벨 규칙)
    labels:
      - "dependencies"
    # PR 담당자는 저장소 소유자(AGENTS.md)
    assignees:
      - "404soonotfound"
