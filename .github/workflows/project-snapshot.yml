name: Project snapshot

# GitHub Project '바라던 바다 V2'(users/404soonotfound/projects/4)의 항목·필드 값을
# project-snapshot 브랜치의 JSON 파일 하나로 옮겨 둠. 아침 보고 루틴(클라우드 세션)은
# Project API(GraphQL·사용자 주소)를 못 읽고 저장소 주소만 읽을 수 있어서 이 파일을 읽음.
# 비밀값 예외: 이 파일만 PROJECT_READ_TOKEN(classic, read:project 하나)을 씀(workflows.test.ts 허용 목록).
on:
  schedule:
    - cron: "30 23 * * *" # 매일 08:30 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # project-snapshot 브랜치에만 push함
    steps:
      # 저장소 코드를 받지 않고 실행함(PR 코드가 토큰에 닿지 않게)
      - name: Project 항목 읽기
        env:
          GH_TOKEN: ${{ secrets.PROJECT_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PROJECT_READ_TOKEN이 비어 있음. 스냅샷을 만들지 않고 멈춤"
            exit 1
          fi
          gh project field-list 4 --owner 404soonotfound --format json --limit 100 > fields.json
          gh project item-list 4 --owner 404soonotfound --format json --limit 1000 > items.json
          # 일부만 읽힌 결과를 전체처럼 남기지 않음
          jq -e '(.items | length) > 0 and (.items | length) == .totalCount' items.json > /dev/null \
            || { echo "::error::항목 수가 비었거나 totalCount와 다름. 스냅샷을 바꾸지 않고 멈춤"; exit 1; }
          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg runUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --slurpfile fields fields.json \
            --slurpfile items items.json \
            '{schemaVersion: 1, project: "users/404soonotfound/projects/4", generatedAt: $generatedAt, runUrl: $runUrl, fields: $fields[0].fields, totalCount: $items[0].totalCount, items: $items[0].items}' \
            > project-items.json
          echo "항목 $(jq '.totalCount' project-items.json)개"

      - name: project-snapshot 브랜치에 올리기
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir out && mv project-items.json out/ && cd out
          git init -q -b project-snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-items.json
          git commit -q -m "chore: Project 스냅샷 $(date -u +%Y-%m-%dT%H:%MZ)"
          # 커밋 하나만 두려고 덮어씀(main과 이어지지 않는 전용 브랜치)
          git push -q --force \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/project-snapshot
