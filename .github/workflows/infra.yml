# 인프라 검사: CDK 코드가 CloudFormation으로 변환되는지(synth)
name: infra
on:
  pull_request:
    paths:
      [
        "infra/**",
        "package.json",
        "package-lock.json",
        ".github/workflows/infra.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "infra/**",
        "package.json",
        "package-lock.json",
        ".github/workflows/infra.yml",
      ]
permissions:
  contents: read
jobs:
  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w infra
      - run: npx cdk synth
        working-directory: infra
