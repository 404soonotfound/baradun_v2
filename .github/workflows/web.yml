# 웹 검사: 린트·타입 검사·정적 빌드(output: export)가 통과하는지
name: web
on:
  pull_request:
    paths:
      [
        "apps/web/**",
        "packages/contracts/**",
        "package.json",
        "package-lock.json",
        "tsconfig.base.json",
        ".github/workflows/web.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "apps/web/**",
        "packages/contracts/**",
        "package.json",
        "package-lock.json",
        "tsconfig.base.json",
        ".github/workflows/web.yml",
      ]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -w apps/web
      - run: npm run typecheck -w apps/web
      - run: npm run build -w apps/web
