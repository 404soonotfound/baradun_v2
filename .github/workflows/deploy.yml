# 사이트 배포: main에 합친 웹·운영자 사이트 변경을 S3·CloudFront에 올림 (아키텍처 11장 가드레일)
# - 장기 키 없음: OIDC로 1시간짜리 임시 키만 받음
# - main push로 돈 CI(ci 워크플로)가 성공한 커밋만, 그 커밋 그대로 올림 (BRD-133)
#   CI와 배포가 동시에 돌면 합친 main이 CI에서 실패해도 배포가 먼저 끝날 수 있어서 CI 뒤로 둠
# - 앱마다 마지막으로 올린 커밋(deploy-version.txt) 뒤로 main CI가 그 앱 빌드 작업까지 검사해 성공한 가장 새 커밋을 올림(BRD-178). 수동 실행은 두 앱 모두
# - 배포 작업은 OIDC 토큰을 받으므로 빌드 캐시를 복원하지 않음(캐시 오염 방지, CodeQL actions/cache-poisoning)
# - production environment는 main 브랜치만 쓸 수 있음
# - data/는 publisher 구역이라 동기화에서 빼고, IAM에서도 거부됨
# - map/은 지도 파일 구역(map-tiles 워크플로가 올림, 결정 기록 D19-1)이라 사이트 동기화에서 뺌
name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch: # npm run deploy:prod 또는 Actions 탭에서 수동 실행 (그 커밋의 ci-ok가 성공일 때만)
permissions:
  contents: read
jobs:
  site:
    # 첫 인프라 배포 전(변수가 비어 있음)에는 건너뜀
    # 자동 배포는 main push CI가 성공했을 때만. 정기 실행·PR CI는 배포하지 않음
    # 저장소 변수 DEPLOY_PAUSED=true면 자동 배포를 멈춤(인프라와 순서를 맞출 때, infra/README)
    if: >-
      vars.DEPLOY_ROLE_ARN != '' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.conclusion == 'success' &&
          vars.DEPLOY_PAUSED != 'true'
        )
      )
    runs-on: ubuntu-latest
    environment: production
    # 그룹은 작업 수준에 둠: 조건에서 건너뛰는 실행(실패·취소·정기 CI)이 그룹에 들어와 대기 중인 배포를 취소하지 않게 함
    concurrency:
      group: deploy-production
      cancel-in-progress: false # 배포 도중 끊지 않음
    permissions:
      contents: read
      actions: read # main CI 실행 결과를 읽음(deploy-plan.sh)
      id-token: write # OIDC 토큰은 이 작업만 받음
    env:
      BUCKET: ${{ vars.SITE_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
      # 이 배포를 부른 CI의 커밋(수동 실행은 실행한 브랜치 main의 커밋). 실제로 올릴 커밋(SHA)은 '올릴 커밋 정하기'가 정함
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # 전체 이력의 main을 받아 올릴 커밋·배포 여부를 정함(BRD-178, .github/scripts/deploy-plan.sh)
      # 자동 배포: 마지막으로 올린 커밋 뒤로 main CI가 이 앱 빌드 작업(CI_JOB)까지 성공한 가장 새 커밋. 수동: 이 커밋(CI 성공일 때만)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - id: decide
        name: 사이트 올릴 커밋 정하기
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          URL: ${{ vars.SITE_URL }}
          CI_JOB: e2e-build # 이 앱을 빌드하는 ci.yml 작업
        # 경로는 이 앱 빌드가 읽는 파일(ci.yml 바뀐 영역 필터에서 ci.yml 제외, workflows.test.ts가 확인)
        run: |
          .github/scripts/deploy-plan.sh "$URL" \
            package.json \
            package-lock.json \
            tsconfig.base.json \
            .nvmrc \
            apps/web \
            packages/contracts \
            packages/design-tokens \
            data/beaches \
            data/beach-meta.json \
            .github/workflows/deploy.yml
      - if: steps.decide.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.decide.outputs.deploy == 'true'
        run: npm ci
      # 웹은 사진 업로드 주소를 이 버킷 하나로만 허용함(BRD-103). 비면 사진 문의가 모두 실패하므로 배포를 멈춤
      - if: steps.decide.outputs.deploy == 'true'
        name: 문의 사진 버킷 이름 확인
        env:
          INQUIRY_PHOTO_BUCKET: ${{ vars.INQUIRY_PHOTO_BUCKET }}
        run: |
          if ! printf '%s' "$INQUIRY_PHOTO_BUCKET" | grep -Eq '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'; then
            echo "::error::vars.INQUIRY_PHOTO_BUCKET에 스택 출력 InquiryPhotoBucketName 값을 넣어 주세요(infra/README '데이터 문의 접수')."
            exit 1
          fi
      - if: steps.decide.outputs.deploy == 'true'
        run: npm run build -w apps/web
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_INQUIRY_PHOTO_BUCKET: ${{ vars.INQUIRY_PHOTO_BUCKET }}
      # 판단 정책 버전 확인(결정 기록 D20-6·7): 웹은 지금 판단 정책 하나만 읽음 → 정책을 바꾼 PR은 publisher(deploy:infra)를 먼저 배포
      # 운영 게시본의 policyVersion을 이 빌드가 읽지 못하면(게시본을 못 읽어도) 올리지 않고 멈춤. publisher 배포 뒤 이 워크플로를 다시 실행
      - if: steps.decide.outputs.deploy == 'true'
        name: 판단 정책 버전 확인
        working-directory: apps/web
        env:
          URL: ${{ vars.SITE_URL }}
        run: node scripts/check-live-policy.mts "$URL"
      - if: steps.decide.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - if: steps.decide.outputs.deploy == 'true'
        name: 사이트 파일 올리기
        working-directory: apps/web/out
        run: |
          # 1) 이름에 해시가 붙은 파일: 1년 캐시. 지우지 않음(열려 있던 탭이 예전 파일을 찾을 수 있게)
          aws s3 sync . "s3://$BUCKET" --exclude "*" --include "_next/static/*" --exclude "data/*" --exclude "map/*" --cache-control "public, max-age=31536000, immutable"
          # 2) 나머지(HTML 등): 매번 새로 확인. 빌드에서 사라진 파일은 지움(map/ 지도 파일은 빌드에 없으므로 빼야 지워지지 않음)
          aws s3 sync . "s3://$BUCKET" --delete --exclude "_next/static/*" --exclude "data/*" --exclude "map/*" --cache-control "public, max-age=0, must-revalidate"
      - if: steps.decide.outputs.deploy == 'true'
        name: CloudFront 캐시 비우기
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
      # 올린 커밋 표시(BRD-178). 다음 배포가 이 커밋과 비교함. 공개 저장소의 커밋 번호라 비밀값 아님
      # 동기화·캐시 비우기가 모두 끝난 뒤 마지막에 올림: 중간에 실패하면 표시가 이 커밋을 가리키지 않아 다시 실행이 건너뛰지 않음
      # (동기화의 --delete가 앞 표시를 지우므로 실패하면 표시 없음 → 다음 실행은 올림)
      - if: steps.decide.outputs.deploy == 'true'
        name: 올린 커밋 표시
        run: printf '%s\n' "$SHA" | aws s3 cp - "s3://$BUCKET/deploy-version.txt" --content-type "text/plain; charset=utf-8" --cache-control "public, max-age=0, must-revalidate"

  # 운영자 사이트(BRD-147): 사용자 사이트와 따로 버킷·CloudFront에 올림. 화면 파일만 있음(데이터는 /ops/*)
  # 인프라 배포 전(변수가 비어 있음)에는 건너뜀. 조건·권한·CI 확인은 site 작업과 같음
  admin:
    if: >-
      vars.DEPLOY_ROLE_ARN != '' && vars.ADMIN_SITE_BUCKET != '' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.conclusion == 'success' &&
          vars.DEPLOY_PAUSED != 'true'
        )
      )
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-admin
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      BUCKET: ${{ vars.ADMIN_SITE_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.ADMIN_DISTRIBUTION_ID }}
      # 이 배포를 부른 CI의 커밋(수동 실행은 실행한 브랜치 main의 커밋). 실제로 올릴 커밋(SHA)은 '올릴 커밋 정하기'가 정함
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # 전체 이력의 main을 받아 올릴 커밋·배포 여부를 정함(BRD-178, .github/scripts/deploy-plan.sh)
      # 자동 배포: 마지막으로 올린 커밋 뒤로 main CI가 이 앱 빌드 작업(CI_JOB)까지 성공한 가장 새 커밋. 수동: 이 커밋(CI 성공일 때만)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - id: decide
        name: 운영자 사이트 올릴 커밋 정하기
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          URL: ${{ vars.ADMIN_SITE_URL }}
          CI_JOB: admin-build # 이 앱을 빌드하는 ci.yml 작업
        # 경로는 이 앱 빌드가 읽는 파일(ci.yml 바뀐 영역 필터에서 ci.yml 제외, workflows.test.ts가 확인)
        run: |
          .github/scripts/deploy-plan.sh "$URL" \
            package.json \
            package-lock.json \
            tsconfig.base.json \
            .nvmrc \
            apps/admin \
            packages/contracts \
            packages/design-tokens \
            data/beaches \
            data/beach-meta.json \
            data/beach-coverage.csv \
            .github/workflows/deploy.yml
      - if: steps.decide.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.decide.outputs.deploy == 'true'
        run: npm ci
      # 로그인 풀 값(비밀값 아님, 스택 출력). 비면 로그인 화면이 '설정 오류'라 배포를 멈춤 (BRD-148, infra/README)
      - if: steps.decide.outputs.deploy == 'true'
        name: 운영자 로그인 풀 값 확인
        env:
          OPERATOR_POOL: ${{ vars.OPERATOR_USER_POOL_ID }}
          OPERATOR_CLIENT: ${{ vars.OPERATOR_CLIENT_ID }}
          DEMO_POOL: ${{ vars.DEMO_USER_POOL_ID }}
          DEMO_CLIENT: ${{ vars.DEMO_CLIENT_ID }}
        run: |
          for value in "$OPERATOR_POOL" "$DEMO_POOL"; do
            printf '%s' "$value" | grep -Eq '^ap-northeast-2_[A-Za-z0-9]+$' || { echo "::error::vars.OPERATOR_USER_POOL_ID·DEMO_USER_POOL_ID에 스택 출력 값을 넣어 주세요(infra/README '운영자 사이트')."; exit 1; }
          done
          for value in "$OPERATOR_CLIENT" "$DEMO_CLIENT"; do
            printf '%s' "$value" | grep -Eq '^[a-z0-9]+$' || { echo "::error::vars.OPERATOR_CLIENT_ID·DEMO_CLIENT_ID에 스택 출력 값을 넣어 주세요(infra/README '운영자 사이트')."; exit 1; }
          done
      - if: steps.decide.outputs.deploy == 'true'
        run: npm run build -w apps/admin # postbuild가 검색 차단·CSP meta·비밀값 0건을 검사함
        env:
          NEXT_PUBLIC_OPERATOR_USER_POOL_ID: ${{ vars.OPERATOR_USER_POOL_ID }}
          NEXT_PUBLIC_OPERATOR_CLIENT_ID: ${{ vars.OPERATOR_CLIENT_ID }}
          NEXT_PUBLIC_DEMO_USER_POOL_ID: ${{ vars.DEMO_USER_POOL_ID }}
          NEXT_PUBLIC_DEMO_CLIENT_ID: ${{ vars.DEMO_CLIENT_ID }}
      - if: steps.decide.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - if: steps.decide.outputs.deploy == 'true'
        name: 운영자 사이트 파일 올리기
        working-directory: apps/admin/out
        run: |
          # 이름에 해시가 붙은 파일: 1년 캐시, 지우지 않음. 나머지(HTML 등): 매번 확인, 빌드에서 사라진 파일은 지움
          # data/는 이 버킷에 없지만 사이트 동기화 규칙(모든 sync는 data/ 제외)을 같게 지킴
          aws s3 sync . "s3://$BUCKET" --exclude "*" --include "_next/static/*" --exclude "data/*" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync . "s3://$BUCKET" --delete --exclude "_next/static/*" --exclude "data/*" --cache-control "public, max-age=0, must-revalidate"
      - if: steps.decide.outputs.deploy == 'true'
        name: CloudFront 캐시 비우기
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
      # 올린 커밋 표시(BRD-178). 다음 배포가 이 커밋과 비교함. 공개 저장소의 커밋 번호라 비밀값 아님
      # 동기화·캐시 비우기가 모두 끝난 뒤 마지막에 올림: 중간에 실패하면 표시가 이 커밋을 가리키지 않아 다시 실행이 건너뛰지 않음
      # (동기화의 --delete가 앞 표시를 지우므로 실패하면 표시 없음 → 다음 실행은 올림)
      - if: steps.decide.outputs.deploy == 'true'
        name: 올린 커밋 표시
        run: printf '%s\n' "$SHA" | aws s3 cp - "s3://$BUCKET/deploy-version.txt" --content-type "text/plain; charset=utf-8" --cache-control "public, max-age=0, must-revalidate"
