# 통합 검사: 바뀐 영역만 검사하고 ci-ok 하나로 결과를 모음 (main 규칙의 필수 검사)
name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 0 * * *" # 매일 09:17 KST 취약점·비밀값 검사만 돌림, 정각 혼잡 회피 (BRD-91, BRD-132)
permissions:
  contents: read
concurrency:
  # 정기 실행은 main push CI와 그룹을 나눠 서로 취소하지 않게 함
  # main push는 push마다(맨 위 커밋) 따로 돌리고 취소하지 않음(BRD-178): 바뀐 영역만 검사·배포하므로
  # 앞 실행이 취소되면 그 커밋의 변경이 배포에서 빠짐. PR은 새 push가 오면 앞 실행을 취소함
  group: ci-${{ github.event_name == 'schedule' && 'schedule' || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # 바뀐 영역 확인 (정기 실행에서는 건너뜀: 경로 비교 대상이 없음)
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter가 PR 변경 파일을 API로 읽음

    outputs:
      web: ${{ steps.filter.outputs.web }}
      web_e2e: ${{ steps.filter.outputs.web_e2e }}
      web_e2e_specs: ${{ steps.filter.outputs.web_e2e_specs }}
      web_e2e_specs_files: ${{ steps.filter.outputs.web_e2e_specs_files }}
      web_e2e_shared: ${{ steps.filter.outputs.web_e2e_shared }}
      admin: ${{ steps.filter.outputs.admin }} # 운영자 사이트(BRD-147)
      admin_e2e: ${{ steps.filter.outputs.admin_e2e }}
      admin_e2e_specs: ${{ steps.filter.outputs.admin_e2e_specs }}
      admin_e2e_specs_files: ${{ steps.filter.outputs.admin_e2e_specs_files }}
      admin_e2e_shared: ${{ steps.filter.outputs.admin_e2e_shared }}
      services: ${{ steps.filter.outputs.services }}
      infra: ${{ steps.filter.outputs.infra == 'true' || steps.filter_config.outputs.changed == 'true' }}
      contracts: ${{ steps.filter.outputs.contracts }} # contracts 변경 여부
      beaches: ${{ steps.filter.outputs.beaches }} # 해변 목록 변경 여부
      deps: ${{ steps.filter.outputs.deps }} # 의존성 변경 여부
      agy_review: ${{ steps.filter.outputs.agy_review }} # 대체 리뷰 도구(BRD-174)
      ops_policy: ${{ steps.filter.outputs.ops_policy }} # 운영 정책 원본 가져오기 도구(D20-11)
      map: ${{ steps.filter.outputs.map }} # 지도 판·지도 제공 경로(D19-1)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes # 앱 전체에서 테스트·문서 경로만 제외
          list-files: json # 변경된 E2E spec만 추가 실행할 때 파일명을 안전하게 전달
          filters: .github/ci-filters.yml
      # 필터 파일의 내용과 관계없이 이 파일을 바꾸면 infra 가드레일을 실행함
      - id: filter_config
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            changed:
              - '.github/ci-filters.yml'
      - name: 경로 필터 결과 확인
        env:
          FILTER_OUTPUTS: ${{ toJSON(steps.filter.outputs) }}
        run: |
          for area in web web_e2e web_e2e_specs web_e2e_shared admin admin_e2e admin_e2e_specs admin_e2e_shared services infra contracts beaches deps agy_review ops_policy map; do
            if ! jq -e --arg area "$area" '.[$area] == "true" or .[$area] == "false"' <<< "$FILTER_OUTPUTS" > /dev/null; then
              echo "::error::경로 필터 결과가 없거나 올바르지 않아요: $area"
              exit 1
            fi
          done

  # 웹: 토큰·문구 키·린트·타입 검사·단위 테스트. 정적 빌드는 e2e-build에서 한 번만(BRD-178)
  # main push도 바뀐 영역만(BRD-178, 10/30 BRD-133 '늘 전체'를 바꿈). 대신 main 규칙이 '최신 브랜치만 머지'라
  # PR CI가 머지 뒤와 같은 내용을 검사함. 바뀌지 않은 영역은 앞 main에서 이미 통과함
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: node .github/scripts/check-smoke.mjs web # 필수 안전·접근성 E2E 태그 누락 방지
      - run: npm run check:tokens -w apps/web # 대비·금지 색
      - run: npm run check:messages -w apps/web # ko·en 문구 키
      - run: npm run lint -w apps/web
      - run: npm run typecheck -w apps/web # 가져다 쓰는 contracts 원본까지 검사 (BRD-102)
      - run: npm run test -w apps/web # 데이터 계층(Vitest)

  # 웹 정적 빌드·CSP는 앱 변경마다 실행. Chromium 핵심 E2E는 화면 관련 PR과 main에서 실행
  e2e-build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      # Next 빌드 캐시(BRD-178). 결과물(out/)이 아니라 중간 캐시라 검사를 건너뛰지 않음. main push에서만 저장하고 PR은 복원만(캐시가 실행마다 쌓이지 않게)
      - id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-web-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**', 'packages/**', '!**/node_modules/**') }}
          restore-keys: next-web-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build -w apps/web # 배포와 같은 정적 빌드, 사이트 주소만 테스트 값 (BRD-102)
        env:
          NEXT_PUBLIC_SITE_URL: https://example.test # 예약 도메인(.test). 운영 값은 deploy.yml의 vars.SITE_URL
      - if: github.event_name == 'push' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-web-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**', 'packages/**', '!**/node_modules/**') }}
      - run: npm run check:csp -w apps/web # CSP meta 해시 일치 검사 (BRD-118)
      # Playwright 브라우저 캐시(BRD-178). 판은 lock 파일이 정함. 캐시가 있어도 OS 의존성은 설치함
      - id: playwright-cache
        if: github.event_name == 'push' || needs.changes.outputs.web_e2e == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: (github.event_name == 'push' || needs.changes.outputs.web_e2e == 'true') && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --no-install playwright install --with-deps chromium # lock 파일의 Playwright 판에 맞는 chromium
        working-directory: apps/web
      - if: (github.event_name == 'push' || needs.changes.outputs.web_e2e == 'true') && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx --no-install playwright install-deps chromium
        working-directory: apps/web
      # /data/**는 가짜 응답만 씀(운영 데이터·외부 타일 서버에 기대지 않음)
      - if: github.event_name == 'push' || needs.changes.outputs.web_e2e == 'true'
        run: npm run test:e2e:smoke -w apps/web
      - if: github.event_name == 'pull_request' && needs.changes.outputs.web_e2e_shared == 'true'
        run: npm run test:e2e -w apps/web # 픽스처·설정 변경은 전체 Chromium 검사
      - if: github.event_name == 'pull_request' && needs.changes.outputs.web_e2e_shared != 'true' && needs.changes.outputs.web_e2e_specs == 'true'
        env:
          CHANGED_E2E_SPECS: ${{ needs.changes.outputs.web_e2e_specs_files }}
        run: node .github/scripts/run-changed-e2e.mjs web # 바뀐 spec의 비핵심 테스트만 추가 실행

  # 운영자 사이트: 린트·타입 검사·단위 테스트 (BRD-147). 빌드·E2E와 나란히 돌림
  admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: node .github/scripts/check-smoke.mjs admin # 필수 로그인·권한 E2E 태그 누락 방지
      - run: npm run lint -w apps/admin
      - run: npm run typecheck -w apps/admin
      - run: npm run test -w apps/admin

  # 운영자 사이트 정적 빌드·결과 검사는 앱 변경마다 실행. 핵심 E2E는 화면 관련 PR과 main에서 실행
  admin-build:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      # Next 빌드 캐시는 main push에서만 저장하고 PR은 복원만(캐시가 실행마다 쌓이지 않게, BRD-178)
      - id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/admin/.next/cache
          key: next-admin-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/admin/**', 'packages/**', '!**/node_modules/**') }}
          restore-keys: next-admin-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build -w apps/admin # postbuild가 CSP meta를 넣고 검사함
        env: # 테스트용 풀 값(비밀값 아님, apps/admin/e2e/fixtures.ts TEST_POOL_ENV). 운영 값은 deploy.yml의 vars
          NEXT_PUBLIC_OPERATOR_USER_POOL_ID: ap-northeast-2_TestOperator
          NEXT_PUBLIC_OPERATOR_CLIENT_ID: testoperatorclient0000000001
          NEXT_PUBLIC_DEMO_USER_POOL_ID: ap-northeast-2_TestDemo
          NEXT_PUBLIC_DEMO_CLIENT_ID: testdemoclient00000000000001
      - if: github.event_name == 'push' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/admin/.next/cache
          key: next-admin-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/admin/**', 'packages/**', '!**/node_modules/**') }}
      - run: npm run check:out -w apps/admin # 고치지 않고 다시 검사(빌드 결과가 그대로인지)
      # Playwright 브라우저 캐시(BRD-178). 판은 lock 파일이 정함. 캐시가 있어도 OS 의존성은 설치함
      - id: playwright-cache
        if: github.event_name == 'push' || needs.changes.outputs.admin_e2e == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: (github.event_name == 'push' || needs.changes.outputs.admin_e2e == 'true') && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --no-install playwright install --with-deps chromium # lock 파일의 Playwright 판에 맞는 chromium
        working-directory: apps/admin
      - if: (github.event_name == 'push' || needs.changes.outputs.admin_e2e == 'true') && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx --no-install playwright install-deps chromium
        working-directory: apps/admin
      - if: github.event_name == 'push' || needs.changes.outputs.admin_e2e == 'true'
        run: npm run test:e2e:smoke -w apps/admin # chromium(mobile·desktop)
      - if: github.event_name == 'pull_request' && needs.changes.outputs.admin_e2e_shared == 'true'
        run: npm run test:e2e -w apps/admin
      - if: github.event_name == 'pull_request' && needs.changes.outputs.admin_e2e_shared != 'true' && needs.changes.outputs.admin_e2e_specs == 'true'
        env:
          CHANGED_E2E_SPECS: ${{ needs.changes.outputs.admin_e2e_specs_files }}
        run: node .github/scripts/run-changed-e2e.mjs admin

  # 백엔드: 린트·타입 검사·테스트(Vitest)
  services:
    needs: changes
    if: needs.changes.outputs.services == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npm run lint -w services --if-present
      - run: npm run typecheck -w services --if-present
      - run: npm run test -w services --if-present
      - run: npm run test:republish # 게시 함수 호출 도구 시험(D20-4, tools/republish는 services 필터에 있음)

  # 인프라: 타입 검사·테스트(Vitest)·CDK synth
  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npm run build -w infra
      - run: npm run test -w infra
      - run: npm run test:map-tiles # 지도 판 검사 도구 시험(D19-1, tools/map-tiles는 infra 필터에 있음)
      - run: npx cdk synth
        working-directory: infra
      # 고정된 공식 참조로 결정적으로 검사. 최신 공개 자료는 iam-reference-audit.yml에서 대조함
      - run: npm run check:iam-actions -w @baradun/infra

  # 계약: 생성 타입 일치·타입 검사·예시 검사
  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit # lock 파일대로 설치
      - run: npm run check:generated -w packages/contracts # 생성 타입 = 커밋본
      - run: npm run typecheck -w packages/contracts # 타입 오류
      - run: npm run test -w packages/contracts # 예시 통과·거부

  # 해변 목록: 계약 모양·slug 규칙·main과 비교(변경·삭제·재사용 금지)
  beaches:
    needs: changes
    if: needs.changes.outputs.beaches == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # main 비교용 전체 기록
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit # lock 파일대로 설치
      - run: npm run check:beaches -w packages/contracts # 모양·slug·main 비교
        env:
          # PR이면 대상 브랜치, main 푸시면 직전 커밋과 비교
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - run: npm run check:coverage -w packages/contracts # 매트릭스 근거·제외 사유·부가 정보(BRD-59)
      - run: npm run test:beaches # 외부 원자료 없이 생성기 회귀 검사

  # 대체 리뷰 도구: 시간 초과·한도·응답 오류·범위 누락 판정 회귀 검사 (BRD-174)
  agy-review:
    needs: changes
    if: needs.changes.outputs.agy_review == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit # lock 파일대로 설치(ajv는 contracts 설치본)
      - run: npm run test:agy-review

  # 운영 정책 원본 가져오기 도구: 9개 항목 검증·실패 때 파일 안 씀 회귀 검사 (D20-11·D16-E5, #335)
  ops-policy:
    needs: changes
    if: needs.changes.outputs.ops_policy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit # lock 파일대로 설치(vitest)
      - run: npm run test:ops-policy

  # 지도 판 확인 (D19-1 · #392): 웹이 쓰는 판(style.ts MAP_VERSION)이 운영 CloudFront에 다 올라가 있는지
  # READY.txt 판 일치 → PMTiles 범위 요청(206·Content-Range·헤더) → 스타일이 부르는 sprite·글꼴 응답. 공개 주소 읽기만(AWS 권한 없음)
  # 지도 판·스타일·지도 파일 도구가 바뀐 PR에서만 돌림. 지도와 무관한 웹 PR은 외부 요청 없음. 올리기는 map-tiles 워크플로 책임
  # main push에서는 돌리지 않음: 같은 내용을 PR에서 확인했고, 실패하면 그 커밋의 배포가 막힘(BRD-178, deploy-plan.sh)
  # 사이트 인프라(CloudFront·버킷·CSP) 변경은 PR 때 운영에 반영 전이라 여기서 보지 않음 → npm run deploy:infra가 배포 뒤 같은 검사를 돌림
  map-files:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.map == 'true'
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # 변수가 비면 확인 없이 초록불이 되지 않게 실패시킴
      - name: 저장소 변수 확인
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::저장소 변수 SITE_URL이 필요해요"
            exit 1
          fi
      - run: node tools/map-tiles/verify.mjs --site "$SITE_URL" # 의존성 없이 node만 씀(npm ci 불필요)

  # 의존성 취약점: 런타임(high 이상)은 실패, 개발 도구는 보고만 (BRD-90)
  # 고치지 못하는 지적은 GitHub 이슈(topic:security)로 사유를 남김. lock 파일만 읽으므로 npm ci 불필요
  # 정기 실행에서는 changes가 건너뛰므로 상태 함수(!cancelled()) 없이는 같이 건너뜀
  audit:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || needs.changes.outputs.deps == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm audit --omit=dev --audit-level=high # 런타임 의존성 게이트
      - if: always() # 게이트가 실패해도 전체 보고는 남김
        run: | # 개발 도구 포함 전체 보고 (실패시키지 않음, 요약 탭에 표시)
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # 비밀값 스캔: PR·main push는 변경분, 정기 실행은 전체 이력 스캔 (BRD-132)
  # 오탐은 .gitleaks.toml 허용 목록으로 관리하고 실제 유출만 실패 처리
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 커밋 비교 및 정기 실행 전체 이력 스캔용
      - name: Gitleaks 다운로드 및 체크섬 검증
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin gitleaks -f "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          rm -f "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          gitleaks version
      - name: 비밀값 스캔 실행
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "정기 실행: 전체 이력 스캔"
            gitleaks detect --config=.gitleaks.toml --redact --verbose
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR 검사: origin/${{ github.base_ref }} 대비 변경분 스캔"
            gitleaks detect --log-opts="origin/${{ github.base_ref }}...HEAD" --config=.gitleaks.toml --redact --verbose
          else
            echo "main push 검사: 직전 커밋 대비 변경분 스캔"
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                BEFORE="HEAD~1"
              else
                BEFORE="HEAD"
              fi
            fi
            if [ "$BEFORE" = "HEAD" ]; then
              gitleaks detect --log-opts="-1" --config=.gitleaks.toml --redact --verbose
            else
              gitleaks detect --log-opts="${BEFORE}..HEAD" --config=.gitleaks.toml --redact --verbose
            fi
          fi

  # 결과 모음: 건너뜀은 통과, 실패·취소는 실패 (정기 실행은 audit·gitleaks 결과만 보면 되므로 건너뜀)
  ci-ok:
    if: always() && github.event_name != 'schedule'
    needs: [
        changes,
        web,
        e2e-build,
        admin,
        admin-build,
        services,
        infra,
        contracts,
        beaches,
        agy-review,
        ops-policy,
        map-files,
        audit,
        gitleaks,
      ] # 하나라도 실패하면 빨간불
    runs-on: ubuntu-latest
    steps:
      - name: 결과 확인
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
