# 통합 검사: 바뀐 영역만 검사하고 ci-ok 하나로 결과를 모음 (main 규칙의 필수 검사)
name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 0 * * *" # 매일 09:17 KST 취약점·비밀값·지도 서버(map-smoke) 검사만 돌림, 정각 혼잡 회피 (BRD-91, BRD-132, BRD-114)
permissions:
  contents: read
concurrency:
  # 정기 실행은 main push CI와 그룹을 나눠 서로 취소하지 않게 함
  # main push는 push마다(맨 위 커밋) 따로 돌리고 취소하지 않음(BRD-178): 바뀐 영역만 검사·배포하므로
  # 앞 실행이 취소되면 그 커밋의 변경이 배포에서 빠짐. PR은 새 push가 오면 앞 실행을 취소함
  group: ci-${{ github.event_name == 'schedule' && 'schedule' || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # 바뀐 영역 확인 (정기 실행에서는 건너뜀: 경로 비교 대상이 없음)
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter가 PR 변경 파일을 API로 읽음

    outputs:
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }} # 운영자 사이트(BRD-147)
      services: ${{ steps.filter.outputs.services }}
      infra: ${{ steps.filter.outputs.infra }}
      contracts: ${{ steps.filter.outputs.contracts }} # contracts 변경 여부
      beaches: ${{ steps.filter.outputs.beaches }} # 해변 목록 변경 여부
      deps: ${{ steps.filter.outputs.deps }} # 의존성 변경 여부
      agy_review: ${{ steps.filter.outputs.agy_review }} # 대체 리뷰 도구(BRD-174)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            web:
              - *shared
              - 'apps/web/**'
              - 'packages/contracts/**'
              - 'packages/design-tokens/**' # 디자인 토큰(결정 기록 D17-3)
              - 'data/beaches/**' # 해변이 바뀌면 상세 페이지 빌드 확인
              - 'data/beach-meta.json' # 검색 별칭·비시즌 배지(빌드 때 읽음, apps/web/src/lib/beaches.ts)
              - '.github/workflows/deploy.yml' # 배포 빌드 방법이 바뀌면 다시 검사·배포(BRD-178)
            admin:
              - *shared
              - 'apps/admin/**'
              - 'packages/contracts/**'
              - 'packages/design-tokens/**'
              - 'data/beaches/**' # 문의 해변 이름표(빌드 때 읽음, apps/admin/src/lib/beach-names.ts)
              - 'data/beach-meta.json' # 해변 관리 별칭·운영 기간(빌드 때 읽음, apps/admin/src/lib/beach-data.ts)
              - 'data/beach-coverage.csv' # 해변 관리 검증 결과(빌드 때 읽음, apps/admin/src/lib/beach-data.ts)
              - '.github/workflows/deploy.yml' # 배포 빌드 방법이 바뀌면 다시 검사·배포(BRD-178)
            services:
              - *shared
              - 'services/**'
              - 'packages/contracts/**'
              - 'data/photo-sources.json' # Lambda 번들에 들어가는 대장(catalog.test가 읽힘을 검사)
            infra:
              - *shared
              - 'infra/**'
              - '.github/workflows/**' # 워크플로 가드레일 테스트
              - '.github/scripts/**' # 배포 판단 스크립트(BRD-178, workflows.test.ts가 읽음)
              - 'tools/map-tiles/**' # 지도 파일 올리기 덮어쓰기 가드(D19-1, workflows.test.ts가 읽음)
            contracts:                  # 공통 설정 + 계약 폴더가 바뀌면
              - *shared
              - 'packages/contracts/**'
            deps: # 의존성이 바뀌면 취약점 검사 (shared 포함: audit 잡 변경도 재검사)
              - *shared
              - '**/package.json'
            beaches: # 해변 목록 또는 검사 규칙이 바뀌면
              - *shared
              - 'tools/beaches/**'
              - 'data/beaches/**'
              - 'data/beach-coverage.csv'
              - 'data/beach-meta.json'
              - 'data/photo-sources.json' # 대표 사진 TourAPI 관광지 대장(BRD-58)
              - 'data/weather-areas.json' # 해변 → 날씨 예보 격자·중기 구역(BRD-181)
              - 'packages/contracts/schemas/**'
              - 'packages/contracts/scripts/**'
            agy_review: # 대체 리뷰 도구 판정 규칙이 바뀌면(agy는 부르지 않음)
              - *shared
              - 'tools/agy-review/**'

  # 웹: 토큰·문구 키·린트·타입 검사·단위 테스트. 정적 빌드는 e2e-build에서 한 번만(BRD-178)
  # main push도 바뀐 영역만(BRD-178, 10/30 BRD-133 '늘 전체'를 바꿈). 대신 main 규칙이 '최신 브랜치만 머지'라
  # PR CI가 머지 뒤와 같은 내용을 검사함. 바뀌지 않은 영역은 앞 main에서 이미 통과함
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:tokens -w apps/web # 대비·금지 색
      - run: npm run check:messages -w apps/web # ko·en 문구 키
      - run: npm run lint -w apps/web
      - run: npm run typecheck -w apps/web # 가져다 쓰는 contracts 원본까지 검사 (BRD-102)
      - run: npm run test -w apps/web # 데이터 계층(Vitest)

  # 웹 정적 빌드: 한 번만 빌드해 CSP 검사 뒤 결과(out/)를 E2E 샤드들이 나눠 씀 (BRD-134·178)
  e2e-build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Next 빌드 캐시(BRD-178). 결과물(out/)이 아니라 중간 캐시라 검사를 건너뛰지 않음. main push에서만 저장하고 PR은 복원만(캐시가 실행마다 쌓이지 않게)
      - id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-web-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**', 'packages/**', '!**/node_modules/**') }}
          restore-keys: next-web-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build -w apps/web # 배포와 같은 정적 빌드, 사이트 주소만 테스트 값 (BRD-102)
        env:
          NEXT_PUBLIC_SITE_URL: https://example.test # 예약 도메인(.test). 운영 값은 deploy.yml의 vars.SITE_URL
      - if: github.event_name == 'push' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-web-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**', 'packages/**', '!**/node_modules/**') }}
      - run: npm run check:csp -w apps/web # CSP meta 해시 일치 검사 (BRD-118)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-site
          path: apps/web/out
          include-hidden-files: true # 빌드 결과의 점 파일도 그대로
          retention-days: 1
          if-no-files-found: error

  # 웹 E2E: 정적 빌드 결과로 전 화면 접근성(axe)·상태별 화면·키보드·반응형 검사 (BRD-39)
  # /data/**는 테스트의 가짜 응답만 씀(운영 데이터·외부 타일 서버에 기대지 않음)
  # 테스트를 4개로 나눠 동시에 돌림(BRD-134). 하나라도 실패하면 e2e 결과가 실패라 ci-ok도 실패
  e2e:
    needs: [changes, e2e-build]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # 한 조각이 실패해도 나머지 결과까지 봄
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Playwright 브라우저 캐시(BRD-178). 판은 lock 파일이 정함. 캐시가 있어도 OS 의존성은 설치함
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --no-install playwright install --with-deps chromium # lock 파일의 Playwright 판에 맞는 chromium
        working-directory: apps/web
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx --no-install playwright install-deps chromium
        working-directory: apps/web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-site
          path: apps/web/out
      - run: npm run test:e2e -w apps/web -- --shard=${{ matrix.shard }}/4

  # 운영자 사이트: 린트·타입 검사·단위 테스트 (BRD-147). 빌드·E2E는 아래 두 작업으로 나눠 나란히 돌림(BRD-178)
  admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -w apps/admin
      - run: npm run typecheck -w apps/admin
      - run: npm run test -w apps/admin

  # 운영자 사이트 정적 빌드·빌드 결과 검사(검색 차단·CSP meta·비밀값 0건). 결과(out/)를 E2E에 넘김
  admin-build:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Next 빌드 캐시는 main push에서만 저장하고 PR은 복원만(캐시가 실행마다 쌓이지 않게, BRD-178)
      - id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/admin/.next/cache
          key: next-admin-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/admin/**', 'packages/**', '!**/node_modules/**') }}
          restore-keys: next-admin-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build -w apps/admin # postbuild가 CSP meta를 넣고 검사함
        env: # 테스트용 풀 값(비밀값 아님, apps/admin/e2e/fixtures.ts TEST_POOL_ENV). 운영 값은 deploy.yml의 vars
          NEXT_PUBLIC_OPERATOR_USER_POOL_ID: ap-northeast-2_TestOperator
          NEXT_PUBLIC_OPERATOR_CLIENT_ID: testoperatorclient0000000001
          NEXT_PUBLIC_DEMO_USER_POOL_ID: ap-northeast-2_TestDemo
          NEXT_PUBLIC_DEMO_CLIENT_ID: testdemoclient00000000000001
      - if: github.event_name == 'push' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/admin/.next/cache
          key: next-admin-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/admin/**', 'packages/**', '!**/node_modules/**') }}
      - run: npm run check:out -w apps/admin # 고치지 않고 다시 검사(빌드 결과가 그대로인지)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-site
          path: apps/admin/out
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # 운영자 사이트 E2E: 로그인 흐름·세션 시간·탭 넘겨받기·axe (Cognito·/ops/*는 가짜 응답, BRD-148)
  admin-e2e:
    needs: [changes, admin-build]
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Playwright 브라우저 캐시(BRD-178). 판은 lock 파일이 정함. 캐시가 있어도 OS 의존성은 설치함
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --no-install playwright install --with-deps chromium # lock 파일의 Playwright 판에 맞는 chromium
        working-directory: apps/admin
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx --no-install playwright install-deps chromium
        working-directory: apps/admin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admin-site
          path: apps/admin/out
      - run: npm run test:e2e -w apps/admin

  # 백엔드: 린트·타입 검사·테스트(Vitest)
  services:
    needs: changes
    if: needs.changes.outputs.services == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -w services --if-present
      - run: npm run typecheck -w services --if-present
      - run: npm run test -w services --if-present

  # 인프라: 타입 검사·테스트(Vitest)·CDK synth
  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w infra
      - run: npm run test -w infra
      - run: npx cdk synth
        working-directory: infra
      # 고정된 공식 참조로 결정적으로 검사. 최신 공개 자료는 iam-reference-audit.yml에서 대조함
      - run: npm run check:iam-actions -w @baradun/infra

  # 계약: 생성 타입 일치·타입 검사·예시 검사
  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci # lock 파일대로 설치
      - run: npm run check:generated -w packages/contracts # 생성 타입 = 커밋본
      - run: npm run typecheck -w packages/contracts # 타입 오류
      - run: npm run test -w packages/contracts # 예시 통과·거부

  # 해변 목록: 계약 모양·slug 규칙·main과 비교(변경·삭제·재사용 금지)
  beaches:
    needs: changes
    if: needs.changes.outputs.beaches == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # main 비교용 전체 기록
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci # lock 파일대로 설치
      - run: npm run check:beaches -w packages/contracts # 모양·slug·main 비교
        env:
          # PR이면 대상 브랜치, main 푸시면 직전 커밋과 비교
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - run: npm run check:coverage -w packages/contracts # 매트릭스 근거·제외 사유·부가 정보(BRD-59)
      - run: npm run test:beaches # 외부 원자료 없이 생성기 회귀 검사

  # 대체 리뷰 도구: 시간 초과·한도·응답 오류·범위 누락 판정 회귀 검사 (BRD-174)
  agy-review:
    needs: changes
    if: needs.changes.outputs.agy_review == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci # lock 파일대로 설치(ajv는 contracts 설치본)
      - run: npm run test:agy-review

  # OpenFreeMap 스모크 (BRD-114 · 결정 기록 12장 결정 10): 고정 타일 판·sprite·글꼴이 아직 그대로 있는지 실제 서버로 확인
  # 매일 정기 실행과 웹 변경 PR에서 돌림. 제3자 서버 상태라 ci-ok(머지 필수)에는 넣지 않고, 실패하면 이 작업만 빨간불
  # main push에서는 돌리지 않음: 실패하면 실행 결론이 실패가 되어 그 커밋의 배포가 막힘(BRD-178, deploy-plan.sh)
  map-smoke:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'pull_request' && needs.changes.outputs.web == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm run check:map -w apps/web # 의존성 없이 node만 씀(npm ci 불필요)

  # 의존성 취약점: 런타임(high 이상)은 실패, 개발 도구는 보고만 (BRD-90)
  # 고치지 못하는 지적은 GitHub 이슈(topic:security)로 사유를 남김. lock 파일만 읽으므로 npm ci 불필요
  # 정기 실행에서는 changes가 건너뛰므로 상태 함수(!cancelled()) 없이는 같이 건너뜀
  audit:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || needs.changes.outputs.deps == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm audit --omit=dev --audit-level=high # 런타임 의존성 게이트
      - if: always() # 게이트가 실패해도 전체 보고는 남김
        run: | # 개발 도구 포함 전체 보고 (실패시키지 않음, 요약 탭에 표시)
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # 비밀값 스캔: PR·main push는 변경분, 정기 실행은 전체 이력 스캔 (BRD-132)
  # 오탐은 .gitleaks.toml 허용 목록으로 관리하고 실제 유출만 실패 처리
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # 커밋 비교 및 정기 실행 전체 이력 스캔용
      - name: Gitleaks 다운로드 및 체크섬 검증
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin gitleaks -f "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          rm -f "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          gitleaks version
      - name: 비밀값 스캔 실행
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "정기 실행: 전체 이력 스캔"
            gitleaks detect --config=.gitleaks.toml --redact --verbose
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR 검사: origin/${{ github.base_ref }} 대비 변경분 스캔"
            gitleaks detect --log-opts="origin/${{ github.base_ref }}...HEAD" --config=.gitleaks.toml --redact --verbose
          else
            echo "main push 검사: 직전 커밋 대비 변경분 스캔"
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                BEFORE="HEAD~1"
              else
                BEFORE="HEAD"
              fi
            fi
            if [ "$BEFORE" = "HEAD" ]; then
              gitleaks detect --log-opts="-1" --config=.gitleaks.toml --redact --verbose
            else
              gitleaks detect --log-opts="${BEFORE}..HEAD" --config=.gitleaks.toml --redact --verbose
            fi
          fi

  # 결과 모음: 건너뜀은 통과, 실패·취소는 실패 (정기 실행은 audit·gitleaks 결과만 보면 되므로 건너뜀)
  ci-ok:
    if: always() && github.event_name != 'schedule'
    needs: [
        changes,
        web,
        e2e-build,
        e2e,
        admin,
        admin-build,
        admin-e2e,
        services,
        infra,
        contracts,
        beaches,
        agy-review,
        audit,
        gitleaks,
      ] # 하나라도 실패하면 빨간불
    runs-on: ubuntu-latest
    steps:
      - name: 결과 확인
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
