<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    공유 미리보기 공통 일러스트 원본 (BRD-105 · 2026-10-28 확정 결정 15·16)
    프로젝트가 직접 그린 자체 소유 자산. 외부 사진·그림을 쓰지 않아 출처 표기가 필요 없음
    색: 토큰 color.brand.weak(#E8F1FD)·color.brand.default(#1366D6)·color.text.default(#0B1A2C)만 씀
    파도: 직접 그린 곡선 하나를 아래로 옮겨 세 겹으로 쌓음
    글자 '바라던 바다': Noto Sans KR Bold(SIL OFL 1.1, 사이트 글꼴과 같음) 글리프를 윤곽선으로 바꿔 넣음.
    글꼴 파일 없이 같은 그림이 나오며, OFL은 글꼴로 만든 그림에 표기를 요구하지 않음
    PNG 만들기: npm run og:image -w apps/web → public/og/share.png (1200×630)
  -->
